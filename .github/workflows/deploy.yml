name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site with secrets injected
        env:
          WHATSAPP_GROUP_LINK: ${{ secrets.WHATSAPP_GROUP_LINK }}
        run: |
          mkdir -p /tmp/site
          cp -r . /tmp/site
          rm -rf /tmp/site/.git /tmp/site/.github
          python3 - <<'PY'
          import os
          path = "/tmp/site/index.html"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          content = content.replace("__WHATSAPP_GROUP_LINK__", os.environ["WHATSAPP_GROUP_LINK"])
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
